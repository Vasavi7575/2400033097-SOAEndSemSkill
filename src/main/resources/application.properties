spring.application.name=library-service-jwt
server.port=8085

# Create this database once in PostgreSQL: CREATE DATABASE librarydb;
spring.datasource.url=jdbc:postgresql://localhost:5432/librarydb
spring.datasource.username=postgres
spring.datasource.password=YOUR_POSTGRES_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use a long random secret (32+ characters). Change it before real deployment.
app.jwt.secret=LibraryServiceJWTSecretKeyForStudentLab2026Secure
app.jwt.expiration-ms=86400000
